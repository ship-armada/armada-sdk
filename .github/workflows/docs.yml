# ABOUTME: Builds the VitePress developer docs (with the TypeDoc API reference) and deploys them to
# ABOUTME: GitHub Pages on every push to main. Serves the custom domain docs.armada.blue.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'typedoc.json'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

# Least-privilege token scoped for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build API reference (TypeDoc)
        run: npm run docs:api
      - name: Build docs site (VitePress)
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
