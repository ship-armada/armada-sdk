# ABOUTME: CI for @armada/sdk — lint, typecheck, unit + differential vector suite, build, on every PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:vendor
      - run: npm test
      - run: npm run build
      - name: PPOI strip guard (no proof-of-innocence code in vendor/)
        run: |
          if grep -rn 'POI' vendor/ | grep -v 'POINTS'; then
            echo "::error::PPOI reference found in vendor/ — must be stripped (SPEC §3.5)"; exit 1
          fi
